name: Metrics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: ['main']

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Madrid
